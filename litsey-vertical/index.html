function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const words = text => text.split(" ").map(w => `<span>${w} </span>`).join("");
let ICONS = {};

/* eight-pointed star (two overlapping squares) */
function octPts(R, cx = 0, cy = 0, rot = 0) {
  const r = R * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8), p = [];
  for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 8, rr = i % 2 ? r : R; p.push(`${(cx + Math.cos(a) * rr).toFixed(2)},${(cy + Math.sin(a) * rr).toFixed(2)}`); }
  return p.join(" ");
}
const solidStar = (R = 96, inner = true) => `<polygon points="${octPts(R)}" fill="url(#gb)" stroke="#5b3f0e" stroke-width="3"/>` +
  (inner ? `<polygon points="${octPts(R * .8)}" fill="none" stroke="#7a5717" stroke-width="2.5" opacity=".75"/><circle r="${R * .56}" fill="#f6dc8e" stroke="#7a5717" stroke-width="3"/>` : "");
function iconSVG(name, sw = 1.35) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="url(#gi)" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${(ICONS[name] || []).map(e => e.replace(/^<(\w+)/, '<$1 pathLength="1"')).join("")}</svg>`;
}
function latticeTile() {
  const s = 180, c = s / 2, st = 'stroke="#f2cf72" stroke-width="2" fill="none"';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><polygon points="${octPts(52, c, c)}" ${st}/><polygon points="${octPts(30, c, c, Math.PI / 8)}" ${st}/>` +
    `<polygon points="${octPts(26, 0, 0)}" ${st}/><polygon points="${octPts(26, s, 0)}" ${st}/><polygon points="${octPts(26, 0, s)}" ${st}/><polygon points="${octPts(26, s, s)}" ${st}/>` +
    `<path d="M${c} ${c - 52}V0M${c} ${c + 52}V${s}M${c - 52} ${c}H0M${c + 52} ${c}H${s}" ${st}/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
/* flag of Uzbekistan, drawn in code */
function flagCanvas(Hf) {
  const W = Hf * 2, cv = document.createElement("canvas"); cv.width = W; cv.height = Hf;
  const g = cv.getContext("2d"), b = Hf / 3, r = Hf * .02;
  g.fillStyle = "#0099b5"; g.fillRect(0, 0, W, b); g.fillStyle = "#fff"; g.fillRect(0, b, W, b);
  g.fillStyle = "#1eb53a"; g.fillRect(0, 2 * b, W, b + 1); g.fillStyle = "#ce1126"; g.fillRect(0, b - r / 2, W, r); g.fillRect(0, 2 * b - r / 2, W, r);
  const cy = b / 2, cx = Hf * .25, R = b * .38;
  g.fillStyle = "#fff"; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  g.fillStyle = "#0099b5"; g.beginPath(); g.arc(cx + R * .32, cy, R * .86, 0, 7); g.fill();
  const star = (x, y, s) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * .4 : s; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); };
  g.fillStyle = "#fff";
  [[3, b * .2], [4, b * .5], [5, b * .8]].forEach(([n, y]) => { for (let i = 0; i < n; i++) star(Hf * .79 - i * b * .2, y, b * .075); });
  return cv;
}
function waveFlag(cv, base, t, fw, fh, amp) {
  const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  const top = (cv.height - fh) / 2, left = (cv.width - fw) / 2, step = 3;
  for (let x = 0; x < fw; x += step) {
    const u = x / fw, a = u * 8 - t * 4.6, dy = Math.sin(a) * amp * (.2 + u), sh = Math.cos(a) * (.1 + u * .16);
    g.drawImage(base, u * base.width, 0, step / fw * base.width + 1, base.height, left + x, top + dy, step + .6, fh);
    g.fillStyle = sh > 0 ? `rgba(255,255,255,${sh * .5})` : `rgba(0,10,20,${-sh})`;
    g.fillRect(left + x, top + dy, step + .6, fh);
  }
}

/* ───────────── build ───────────── */
let DUR = 0, FLAG;
function build() {
  let bar = 0;
  SCENES.forEach((s, i) => { s.i = i; s.bars = s.bars || 2; s.t0 = bar * BAR; s.t1 = (bar + s.bars) * BAR; bar += s.bars; });
  DUR = bar * BAR;
  $("lattice").style.backgroundImage = latticeTile();
  // mandala behind the star
  let m = `<svg viewBox="-700 -700 1400 1400">`;
  m += `<g id="m1"><polygon points="${octPts(560)}" fill="none" stroke="#f2cf72" stroke-width="3"/><polygon points="${octPts(520)}" fill="none" stroke="#f2cf72" stroke-width="1.5"/></g>`;
  m += `<g id="m2"><polygon points="${octPts(450, 0, 0, Math.PI / 8)}" fill="none" stroke="#f2cf72" stroke-width="2"/>${Array.from({ length: 16 }, (_, i) => { const a = i * Math.PI / 8; return `<line x1="${Math.cos(a) * 380}" y1="${Math.sin(a) * 380}" x2="${Math.cos(a) * 660}" y2="${Math.sin(a) * 660}" stroke="#f2cf72" stroke-width="1.5"/>`; }).join("")}</g>`;
  m += `<g id="m3"><circle r="400" fill="none" stroke="#f2cf72" stroke-width="2" stroke-dasharray="3 14"/>${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<polygon points="${octPts(18, Math.cos(a) * 610, Math.sin(a) * 610)}" fill="#f2cf72"/>`; }).join("")}</g></svg>`;
  $("mandala").innerHTML = m;
  // big star frame: thick outer star, inner line star, beads on the tips
  const beads = Array.from({ length: 8 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 4; return `<circle cx="${(Math.cos(a) * 318).toFixed(1)}" cy="${(Math.sin(a) * 318).toFixed(1)}" r="9" fill="url(#gb)"/>`; }).join("");
  $("frame").querySelector(".rot").innerHTML = `<svg viewBox="-340 -340 680 680"><polygon points="${octPts(330)}" fill="rgba(6,20,15,.55)" stroke="url(#gs)" stroke-width="12" stroke-linejoin="round"/>` +
    `<polygon points="${octPts(300)}" fill="none" stroke="url(#gs)" stroke-width="3"/><polygon points="${octPts(282)}" fill="none" stroke="#f2cf72" stroke-width="1.2" opacity=".5"/>${beads}</svg>`;
  $("pill").querySelectorAll("svg").forEach(s => s.innerHTML = solidStar(96, false));
  const root = $("scenes"), fc = $("fcontent");
  for (const s of SCENES) {
    if (s.type === "item") buildItem(s, root, fc);
    else if (s.type === "section") buildSection(s, root, fc);
    else if (s.type === "score") buildScore(s, root);
    else if (s.type === "intro" || s.type === "outro") buildTitle(s, root);
  }
  for (const k of ["q", "i"]) {        // progress rows
    const n = SEC[k].n, gap = 104, x0 = 540 - (n - 1) * gap / 2, w = h(`<div class="L" style="height:60px"></div>`);
    w.appendChild(h(`<div class="line" style="left:${x0}px;width:${(n - 1) * gap}px"><div class="fill"></div></div>`));
    for (let j = 0; j < n; j++) w.appendChild(h(`<div class="node" style="left:${x0 + j * gap}px"><svg viewBox="-100 -100 200 200">${solidStar(96, false)}</svg><b>${j + 1}</b></div>`));
    $("prog").appendChild(w); SEC[k].prog = w; SEC[k].nodes = [...w.querySelectorAll(".node")];
  }
}

function buildItem(s, root, fc) {
  const sec = SEC[s.sec];
  const cont = h(`<div style="position:absolute;left:0;top:0"></div>`);
  const icons = s.cycle || [s.icon];
  const iy = s.pct ? -150 : s.inner ? -40 : 0, isz = s.pct ? 150 : s.inner ? .82 : 1;
  icons.forEach(n => cont.insertAdjacentHTML("beforeend", `<div class="ico" style="transform:translateY(${iy}px)">${iconSVG(n)}</div>`));
  if (s.pct) cont.insertAdjacentHTML("beforeend", `<div class="pct gold"><b>0</b><small>%</small></div>`);
  if (s.inner) cont.insertAdjacentHTML("beforeend", `<div class="inner gold" style="top:${s.inner.length > 10 ? 108 : 104}px;font-size:${s.inner.length > 10 ? 32 : 44}px;letter-spacing:${s.inner.length > 10 ? 3 : 6}px">${s.inner}</div>`);
  if (s.cycle) cont.insertAdjacentHTML("beforeend", `<div class="inner gold cyc" style="top:110px;font-size:36px;letter-spacing:3px"></div>`);
  cont.insertAdjacentHTML("beforeend", `<div class="badge"><svg viewBox="-100 -100 200 200">${solidStar()}</svg><b>${s.n}</b></div>`);

  if (s.inner && !s.pct) icoEls.forEach(e => { e.style.transform = `translateY(-55px) scale(${isz})`; });
  if (s.cycle) icoEls.forEach(e => { e.style.transform = `translateY(-50px) scale(.78)`; });
  const txt = h(`<div class="txt"></div>`);
  txt.innerHTML = `<div class="lbl gold">${s.n}-${sec.unit}</div><h2 class="ttl">${words(s.title)}</h2>` +
    `<div class="orn"><i></i><svg viewBox="-100 -100 200 200">${solidStar(96, false)}</svg><i></i></div>` +
    (s.desc ? `<p class="desc">${words(s.desc)}</p>` : "") +
    (s.chips ? `<div class="chips">${s.chips.map(([ic, lab]) => `<div class="chip">${ic ? iconSVG(ic, 1.7) : `<svg viewBox="-100 -100 200 200" style="width:26px;height:26px">${solidStar(96, false)}</svg>`}${lab}</div>`).join("")}</div>` : "");

    paths: icoEls.map(e => [...e.querySelectorAll("svg > *")]), lbl: txt.querySelector(".lbl"), tw: [...txt.querySelectorAll(".ttl span")],

}

function buildSection(s, root, fc) {
  const sec = SEC[s.sec];
  const cont = h(`<div style="position:absolute;left:0;top:0"><div class="bignum gold">${sec.n}</div><div class="inner gold" style="font-size:52px;letter-spacing:10px">${sec.unit}</div></div>`);
  fc.appendChild(cont);
  const el = h(`<div class="sec L"><div class="small">${sec.small}</div><div class="big">${sec.big.map(w => `<span>${[...w].map(c => `<span class="ch">${c}</span>`).join("")}</span>`).join("<br>")}</div></div>`);
  if (s.sec === "i") { el.querySelector(".big").style.fontSize = "128px"; }
  root.appendChild(el);
  Object.assign(s, { cont, el, small: el.querySelector(".small"), chars: [...el.querySelectorAll(".ch")], num: cont.querySelector(".bignum"), unitEl: cont.querySelector(".inner") });
}

    `<div class="mi">${iconSVG(ic)}</div><div class="mn gold">0</div></div><div class="mname gold" style="left:${cx - 250}px;top:935px">${name}</div><div class="mdet" style="left:${cx - 250}px;top:1020px">30 ta savol<br>Har biri — ${per} ball</div>`;

}

/* ───────────── particles ───────────── */
const dctx = $("dust").getContext("2d"), sctx = $("sparks").getContext("2d");
const DUST = (() => { const r = rng(7); return Array.from({ length: 110 }, () => ({ x: r() * 1080, y: r() * 1920, s: 1 + r() * 3.4, v: 12 + r() * 40, sw: r() * 6.28, a: .2 + r() * .6, tw: 1 + r() * 3 })); })();
function drawDust(t) {
  dctx.clearRect(0, 0, 1080, 1920);
  for (const p of DUST) {
    const y = ((p.y - p.v * t) % 1980 + 1980) % 1980 - 30, x = p.x + Math.sin(t * .6 + p.sw) * 26, a = p.a * (.5 + .5 * Math.sin(t * p.tw + p.sw));
    const g = dctx.createRadialGradient(x, y, 0, x, y, p.s * 3.2);
    g.addColorStop(0, `rgba(255,232,160,${a})`); g.addColorStop(1, "rgba(255,232,160,0)");
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, p.s * 3.2, 0, 6.283); dctx.fill();
  }
}
let BURSTS = [];   // [time, x, y, scale, seed]
function drawSparks(t) {
  sctx.clearRect(0, 0, 1080, 1920);
  for (const [bt, bx, by, sc, seed] of BURSTS) {
    const l = t - bt; if (l < 0 || l > 1.4) continue;
    const r = rng(seed);
    for (let i = 0; i < 64; i++) {
      const a = (i % 8) * Math.PI / 4 - Math.PI / 2 + (r() - .5) * .5, v = (500 + r() * 900) * sc, d = v * (1 - Math.exp(-l * 3)) / 3;
      const x = bx + Math.cos(a) * (d + 300 * sc * (i % 8 === 0 ? 1 : 1)), y = by + Math.sin(a) * (d + 300 * sc) + 160 * l * l;
      const al = clamp(1 - l / 1.4) * (.5 + r() * .5), len = 10 + r() * 22;
      sctx.strokeStyle = `rgba(255,${200 + r() * 50 | 0},${110 + r() * 80 | 0},${al})`; sctx.lineWidth = 2 + r() * 2.5;
      sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - Math.cos(a) * len, y - Math.sin(a) * len); sctx.stroke();
    }
  }
}

/* ───────────── frame ───────────── */
let lastShown = new Set();
const sceneAt = t => SCENES.find(s => t >= s.t0 && t < s.t1) || SCENES[SCENES.length - 1];
function starAngle(t) {   // slow drift plus a 45° turn at each scene change between intro and outro
  let a = t * 4;
  for (const s of SCENES) if (s.type !== "intro" && s.type !== "outro") a += 45 * P(t, s.t0 - .15, .75, E.inOutCubic);
  return a;
}

function render(t) {
  const shown = new Set(), cur = sceneAt(t), intro = SCENES[0], outro = SCENES[SCENES.length - 1];
  const mid = t >= intro.t1 - .6 && t < outro.t0 + .6;
  // background
  tf($("rays"), `rotate(${t * 5}deg)`);
  $("lattice").style.backgroundPosition = `0px ${-t * 14}px`;
  drawDust(t); drawSparks(t);
  const md = $("mandala");
  tf(md.querySelector("#m1"), `rotate(${t * 3}deg)`); tf(md.querySelector("#m2"), `rotate(${-t * 5}deg)`); tf(md.querySelector("#m3"), `rotate(${t * 8}deg)`);
  const mdraw = P(t, .1, 2.2, E.inOutCubic);
  md.style.opacity = .1 + .14 * mdraw + .12 * Math.max(0, Math.sin(t * 2.6)) * (cur.type === "intro" || cur.type === "outro" ? 1 : 0);
  tf(md, `scale(${lerp(.4, 1, mdraw)})`);

  // flag in intro / outro
  const fk = Math.max(P(t, .4, 1, E.outCubic) * (1 - P(t, intro.t1 - 1.2, .8)), P(t, outro.t0 + .4, 1));
  if (show($("bflag"), fk > .01)) { $("bflag").style.opacity = fk; tf($("bflag"), `translateY(${(1 - fk) * -40}px)`); waveFlag($("bflag"), FLAG, t, 520, 260, 16); }

  // header, pill, progress (between intro and outro)
  const hk = P(t, intro.t1 - .5, .7, E.outExpo) * (1 - P(t, outro.t0, .5));
  if (show($("hdr"), hk > .01)) {
    $("hdr").style.opacity = hk;
    const n = cur.type === "item" ? cur.n : 0, sec = SEC[cur.sec || "q"];
    $("hcnt").innerHTML = n ? `${String(n).padStart(2, "0")}<span>/${String(sec.n).padStart(2, "0")}</span>` : "";
    $("hlogo").style.opacity = t < intro.t1 ? 0 : 1;
  }
  const pk = cur.type === "item" || cur.type === "section" ? 1 : 0;
  if (show($("pill"), hk > .01 && pk)) {
    const l = t - cur.t0, k = cur.type === "section" ? P(l, .3, .6, E.outBack) : 1;
    $("pill").querySelector(".t").textContent = SEC[cur.sec].pill;
    $("pill").style.opacity = hk; tf($("pill"), `translateX(-50%) scale(${Math.max(0, k)})`);
    $("pill").querySelectorAll("svg").forEach((s, i) => tf(s, `rotate(${(i ? -1 : 1) * t * 60}deg)`));
  }
  for (const k of ["q", "i"]) {
    const sec = SEC[k], on = hk > .01 && cur.sec === k && cur.type !== "score" || (cur.type === "score" && k === "q");
    if (!show(sec.prog, on)) continue;
    const l = t - cur.t0, idx = cur.type === "item" ? cur.n - 1 : cur.type === "score" ? sec.n : -1;
    sec.prog.style.opacity = hk;
    sec.nodes.forEach((nd, j) => {
      const app = cur.type === "section" ? P(l, 1 + j * .1, .4, E.outBack) : 1, isCur = j === idx;
      tf(nd, `scale(${Math.max(0, app) * (isCur ? 1.35 + .05 * Math.sin(t * 6) : 1)}) rotate(${isCur ? t * 50 : 0}deg)`);
      nd.style.opacity = j <= idx ? 1 : .3;
      nd.lastChild.style.transform = `rotate(${isCur ? -t * 50 : 0}deg)`;
    });
    const to = idx <= 0 ? 0 : Math.min(1, idx / (sec.n - 1)), from = idx <= 1 ? 0 : (idx - 1) / (sec.n - 1);
    sec.prog.querySelector(".fill").style.width = lerp(from, to, P(l, .1, .7, E.inOutCubic)) * 100 + "%";
  }

  // big star frame
  const fr = $("frame");
  let fs = 0;
  if (mid) {
    fs = P(t, intro.t1 - .5, .9, E.outBack) * (1 - P(t, outro.t0 - .2, .6, E.inCubic));
    const sc = SCENES.find(s => s.type === "score"), scK = t > sc.t0 - .3 && t < sc.t1 + .3 ? Math.min(P(t, sc.t0 - .3, .5, E.inCubic), 1 - P(t, sc.t1 - .3, .6, E.outBack)) : 0;
    fs *= 1 - scK;
    const secBoost = SCENES.filter(s => s.type === "section").reduce((a, s) => a + Math.min(P(t, s.t0 - .2, .6, E.inOutCubic), 1 - P(t, s.t1 - .3, .6, E.inOutCubic)), 0);
    const pulse = SCENES.reduce((a, s) => a + (s.type !== "intro" ? Math.sin(Math.PI * P(t, s.t0 - .15, .6, E.lin)) : 0), 0);
    tf(fr, `scale(${Math.max(0, fs) * (1 + .12 * secBoost) * (1 - .07 * pulse)})`);
    fr.querySelector(".rot").style.transform = `rotate(${starAngle(t)}deg)`;
    fr.querySelector(".glow").style.opacity = .7 + .3 * Math.sin(t * 2.2);
  }
  show(fr, mid && fs > .01);

  // scenes
  let flash = 0, shake = 0;
  for (const s of SCENES) {
    const l = t - s.t0, ex = P(t, s.t1 - .3, .4, E.inCubic);
    const live = l >= -.05 && t < s.t1 + .15;
    if (s.type === "item") { if (show(s.cont, live) & show(s.txt, live)) drawItem(s, l, ex, t); continue; }
    if (s.type === "section") { show(s.cont, live); if (show(s.el, live)) drawSection(s, l, ex, t); continue; }
    if (s.type === "score") { if (show(s.el, live)) drawScore(s, l, ex); continue; }
    if (show(s.el, l >= 0 && t < s.t1 + .1)) { const r = drawTitle(s, l, ex, t); flash = Math.max(flash, r.flash); shake = Math.max(shake, r.shake); }
  }
  // section entrances flash
  for (const s of SCENES) if (s.type === "section" || s.type === "score") flash = Math.max(flash, (1 - P(t, s.t0, .4)) * (t >= s.t0 ? .55 : 0));
  drawLogo(t, intro, outro);
  $("flash").style.opacity = flash;
  const sh = shake * Math.sin(t * 71);
  tf($("world"), shake > .3 ? `translate(${sh}px,${sh * .7}px)` : "none");
  $("fade").style.opacity = Math.max(1 - P(t, 0, .5), P(t, DUR - 1.6, 1.6, E.inOutCubic));
}

function drawIcon(paths, l, start) {
  paths.forEach((p, i) => { const k = P(l, start + i * .1, .7, E.inOutCubic); p.style.strokeDashoffset = 1 - k; p.style.strokeDasharray = 1; });
}

function drawItem(s, l, ex, t) {
  const inK = P(l, -.05, .3), outK = ex;
  // icon(s)
  if (s.cycle) {
    const seg = BAR * 2 / 3.2, idx = Math.min(2, Math.floor(Math.max(0, l - .1) / seg));
    s.icoEls.forEach((e, i) => {
      const li = l - .1 - i * seg, on = i === idx;
      e.style.opacity = on ? clamp(li * 4) * (1 - outK) * (i < 2 ? 1 - P(li, seg - .15, .15) : 1) : 0;
      if (on) drawIcon(s.paths[i], li, 0);
    });
    s.cycEl.textContent = s.chips[idx][1].toUpperCase();
    s.cycEl.style.opacity = (1 - outK) * clamp((l - .3) * 3);
    s.chipEls.forEach((c, i) => c.classList.toggle("on", i === idx && l > .3));
  } else {
    s.icoEls.forEach((e, i) => { e.style.opacity = inK * (1 - outK); drawIcon(s.paths[i], l, .15); });
  }
  const ib = P(l, .1, .7, E.outBack), breathe = 1 + .02 * Math.sin(t * 2.4);
  s.icoEls.forEach(e => { e.firstChild.style.transform = `scale(${(.6 + .4 * Math.max(0, ib)) * breathe * (1 - outK * .4)})`; });
  if (s.pctEl) { s.pctEl.parentNode.style.opacity = P(l, .7, .3) * (1 - outK); s.pctEl.textContent = Math.round(s.pct * P(l, .8, 1.6, E.outCubic)); tf(s.pctEl.parentNode, `scale(${.7 + .3 * P(l, .7, .5, E.outBack)})`); }
  if (s.innerEl && !s.cycle) { const k = P(l, .9, .5, E.outBack); s.innerEl.style.opacity = clamp(k * 2) * (1 - outK); tf(s.innerEl, `scale(${Math.max(0, k)})`); }
  // number badge flips in
  const bk = P(l, .05, .5, E.outBack);
  s.badge.style.opacity = clamp(bk * 3) * (1 - outK);
  tf(s.badge, `perspective(600px) rotateY(${(1 - clamp(bk)) * 90 - outK * 90}deg) scale(${.6 + .4 * Math.max(0, bk)})`);
  // text block
  s.txt.style.opacity = 1 - outK; s.txt.style.filter = outK > .01 ? `blur(${outK * 8}px)` : "none";
  tf(s.txt, `translateY(${-outK * 70}px)`);
  const lk = P(l, .1, .5, E.outExpo); s.lbl.style.opacity = lk; s.lbl.style.letterSpacing = lerp(30, 12, lk) + "px";
  s.tw.forEach((w, i) => { const k = P(l, .2 + i * .07, .55, E.outBack); w.style.opacity = clamp(k * 2); tf(w, `translateY(${(1 - k) * 90}px) scale(${.8 + .2 * clamp(k)})`); });
  const ok = P(l, .55, .6, E.outExpo); tf(s.orn, `scaleX(${ok})`); s.orn.style.opacity = ok;
  tf(s.orn.querySelector("svg"), `rotate(${t * 90}deg)`);
  s.dw.forEach((w, i) => { const k = P(l, .75 + i * .03, .35); w.style.opacity = k; tf(w, `translateY(${(1 - k) * 22}px)`); });
  const c0 = s.dw.length ? 1.0 + Math.min(.6, s.dw.length * .02) : .9;
  s.chipEls.forEach((c, i) => { const k = P(l, c0 + i * .14, .45, E.outBack); c.style.opacity = clamp(k * 2); tf(c, `scale(${Math.max(0, k)}) translateY(${Math.sin(t * 2 + i) * 3}px)`); });
}

function drawSection(s, l, ex, t) {
  const fade = 1 - ex;
  const nk = P(l, .25, .7, E.outBack);
  s.num.style.opacity = clamp(nk * 2) * fade; tf(s.num, `scale(${Math.max(0, nk) * (1 + .03 * Math.sin(t * 5))})`);
  const uk = P(l, .6, .5, E.outExpo); s.unitEl.style.opacity = uk * fade; s.unitEl.style.top = "120px"; s.unitEl.style.letterSpacing = lerp(30, 10, uk) + "px";
  const sk = P(l, .2, .5); s.small.style.opacity = sk * fade; tf(s.small, `translateY(${(1 - sk) * 30}px)`);
  s.chars.forEach((c, i) => { const k = P(l, .35 + i * .035, .5, E.outBack); c.style.opacity = clamp(k * 2) * fade; tf(c, `translateY(${(1 - k) * 120}px) rotate(${(1 - clamp(k)) * 25}deg)`); });
  s.el.style.filter = ex > .01 ? `blur(${ex * 10}px)` : "none";
}

function drawScore(s, l, ex) {
  const fade = 1 - ex;
  const hk = P(l, .1, .5, E.outExpo); s.head.style.opacity = hk * fade; s.head.style.letterSpacing = lerp(20, 3, hk) + "px";
  s.meds.forEach((m, i) => {
    const k = P(l, .25 + i * .2, .7, E.outBack);
    m.style.opacity = clamp(k * 2) * fade; tf(m, `scale(${Math.max(0, k)}) rotate(${(1 - clamp(k)) * -90}deg)`);
    drawIcon(s.micons[i], l, .5 + i * .2);
    s.nums[i].textContent = Math.round([93, 63][i] * P(l, .8 + i * .2, 1.5, E.outCubic));
    const nk = P(l, .6 + i * .2, .5); s.names[i].style.opacity = nk * fade; s.dets[i].style.opacity = P(l, .8 + i * .2, .5) * fade;
  });
  const bk = P(l, 1.9, .8, E.inOutCubic); s.sbar.style.opacity = fade; s.sbar.style.clipPath = `inset(0 ${(1 - bk) * 100}% 0 0)`;
  const tk = P(l, 2.6, .6, E.outBack); s.total.style.opacity = clamp(tk * 2) * fade; tf(s.total, `translateX(-50%) scale(${Math.max(0, tk)})`);
  s.tq.textContent = Math.round(60 * P(l, 2.7, 1.0)); s.tb.textContent = Math.round(156 * P(l, 2.7, 1.4));
  s.agency.style.opacity = P(l, 3.4, .6) * fade;
}

function drawTitle(s, l, ex, t) {
  const out = s.type === "outro", fade = out ? 1 : 1 - P(l, s.bars * BAR - 1.2, .8);
  const hit = out ? 1.2 : BAR;                      // logo lands (on a beat)
  s.rings.forEach((r, i) => {
    const rk = clamp((l - hit - i * .14) / 1.0), size = 300 + rk * 1500;
    r.style.width = r.style.height = size + "px"; r.style.left = 540 - size / 2 + "px"; r.style.top = (out ? 1010 : 1100) - size / 2 + "px";
    r.style.opacity = l > hit + i * .14 && rk < 1 ? (1 - rk) * .9 : 0;
  });
  s.haloP.forEach((p, i) => { const k = P(l, (out ? .2 : .1) + i * .2, out ? 1.2 : 2.0, E.inOutCubic); p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1 - k; });
  s.halo.style.opacity = fade; tf(s.halo, `rotate(${t * 6}deg) scale(${l > hit ? 1 + .06 * Math.exp(-(l - hit) * 4) : 1})`);
  const t1 = hit + .5;
  s.l1.forEach((c, i) => { const k = P(l, t1 + i * .025, .45, E.outBack); c.style.opacity = clamp(k * 2) * fade; tf(c, `translateY(${(1 - k) * -60}px)`); });
  const k2 = P(l, t1 + .5, .8, E.outExpo); s.l2.style.opacity = k2 * fade; s.l2.style.letterSpacing = lerp(36, 3, k2) + "px";
  let shake = l > hit ? 22 * Math.exp(-(l - hit) * 6) : 0;
  s.slog.forEach((w, i) => {
    const at = 2.4 + i * BEAT * 2, k = P(l, at, .45, E.outBack);
    w.style.opacity = clamp(k * 2); tf(w, `scale(${lerp(2.4, 1, clamp(k))})`);
    if (l > at) shake = Math.max(shake, 12 * Math.exp(-(l - at) * 7));
  });
  const flash = l >= hit ? (1 - P(l, hit, .5)) * .9 : P(l, hit - .5, .5, E.inCubic) * .3;
  if (!out && Math.abs(l - hit) < .02) void 0;
  return { flash, shake };
}

/* the logo: slams in at the start, flies to the header, flies back for the finale */
function drawLogo(t, intro, outro) {
  const el = $("ilogo");
  const HDR = { x: 124, y: 120, s: 136 }, IN = { x: 540, y: 1100, s: 680 }, OUT = { x: 540, y: 1010, s: 600 };
  let x, y, s, op = 1, rot = 0, blur = 0;
  if (t < intro.t1) {
    const k = P(t, BAR - .45, .45, E.inExpo), fly = P(t, intro.t1 - 1.1, 1.1, E.inOutCubic);
    s = t < BAR ? lerp(2.4, 1, k) * IN.s : IN.s * (1 + .05 * Math.exp(-(t - BAR) * 5) * Math.sin((t - BAR) * 24) + (t - BAR) * .01);
    op = clamp(k * 1.3); rot = t < BAR ? (1 - k) * -30 : 0; blur = t < BAR ? (1 - k) * 16 : 0;
    x = lerp(IN.x, HDR.x, fly); y = lerp(IN.y, HDR.y, fly); s = lerp(s, HDR.s, fly);
  } else if (t >= outro.t0) {
    const k = P(t, outro.t0, 1.2, E.inOutCubic), l = t - outro.t0;
    x = lerp(HDR.x, OUT.x, k); y = lerp(HDR.y, OUT.y, k);
    s = lerp(HDR.s, OUT.s, k) * (l > 1.2 ? 1 + .04 * Math.exp(-(l - 1.2) * 5) * Math.sin((l - 1.2) * 24) + (l - 1.2) * .008 : 1);
  } else { show(el, false); return; }
  show(el, true);
  el.style.left = x - s / 2 + "px"; el.style.top = y - s / 2 + "px"; el.style.width = el.style.height = s + "px";
  el.style.opacity = op; tf(el, `rotate(${rot}deg)`); el.style.filter = blur > .1 ? `blur(${blur}px) brightness(${1 + blur / 16})` : "none";
  const sw = t < intro.t1 ? P(t, 4.0, 1.2, E.inOutCubic) : P(t, outro.t0 + 1.4, 1.2, E.inOutCubic);
  tf(el.querySelector(".lshine i"), `translateX(${lerp(-0.4, 1.3, sw) * s}px) skewX(-20deg)`);
}

/* ───────────── boot ───────────── */
let ready;
window.__ready = new Promise(r => { ready = r; });
window.__seek = t => render(t);
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); tf($("stage"), `scale(${s})`); }
addEventListener("resize", fit); fit();

(async () => {
  ICONS = await (await fetch("icons.json")).json();
  FLAG = flagCanvas(300);
  build();
  // spark bursts from the star tips at every scene change, and for the logo hits
  BURSTS = SCENES.filter(s => s.type !== "intro").map((s, i) => s.type === "outro" ? [s.t0 + 1.2, 540, 1010, 1.1, 99] : s.type === "score" ? [s.t0 + .3, 540, 680, 1.0, 50 + i] : [s.t0 + .05, SC.x, SC.y, 1, 10 + i]);
  BURSTS.push([BAR, 540, 1100, 1.2, 7]);
  await Promise.all(['800 40px "SairaC"', '700 40px "SairaC"', '500 40px "SairaC"', '500 40px "Manrope"', '40px "Stencil"'].map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  window.__duration = DUR;
  window.__scenes = SCENES.map(s => ({ type: s.type, sec: s.sec || null, n: s.n || null, t0: s.t0, t1: s.t1 }));
  render(0);
  ready();
  if (RENDER) return;
  if (Q.has("t")) { render(+Q.get("t")); return; }
  const snd = new Audio("out/soundtrack.mp3");
  let start = performance.now(), sound = false;
  const now = () => sound && !snd.paused ? snd.currentTime % DUR : ((performance.now() - start) / 1000) % DUR;
  $("stage").addEventListener("click", () => { start = performance.now(); if (!sound) { sound = true; snd.currentTime = 0; snd.play().catch(() => { sound = false; }); } else snd.currentTime = 0; });
  $("bar").addEventListener("click", e => { const tt = e.clientX / innerWidth * DUR; start = performance.now() - tt * 1000; if (sound) snd.currentTime = tt; });
  (function loop() { const t = now(); render(t); $("bar").firstChild.style.width = (t / DUR * 100) + "%"; requestAnimationFrame(loop); })();
})();
</script>
