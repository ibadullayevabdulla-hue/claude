<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>October Premieres Thumbnail</title>
<style>
@font-face{font-family:"Bebas";src:url("fonts/bebas-neue-latin-400-normal.woff2") format("woff2");font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:"Bebas",Impact,sans-serif;background:radial-gradient(ellipse 70% 80% at 50% 100%,#5b2a86 0%,#1d0f33 55%,#0d0718 100%)}
.glow{position:absolute;left:340px;top:330px;width:600px;height:500px;background:radial-gradient(closest-side,rgba(255,122,26,.55),transparent);filter:blur(10px)}
.p{position:absolute;bottom:-40px;width:250px;height:375px;border-radius:16px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 0 3px rgba(255,255,255,.15)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
#t1{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:190px;line-height:1}
#t1 span{background:linear-gradient(180deg,#ffd76a,#ff7a1a 62%,#e8550c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #1b0f2a) drop-shadow(0 14px 24px rgba(0,0,0,.6))}
#t2{position:absolute;left:0;right:0;top:182px;text-align:center;font-size:72px;color:#fff;letter-spacing:.06em;text-shadow:0 5px 0 #1b0f2a,0 10px 24px rgba(0,0,0,.6)}
#t2 b{color:#ffb703;font-weight:400}
</style>
</head>
<body>
<div class="glow"></div>
<div class="p" style="left:20px;transform:rotate(-14deg);bottom:-70px"><img src="posters/hd/peppa.jpg"></div>
<div class="p" style="left:250px;transform:rotate(-7deg)"><img src="posters/hd/yugly.jpg"></div>
<div class="p" style="left:780px;transform:rotate(7deg)"><img src="posters/hd/abyss.jpg"></div>
<div class="p" style="left:1010px;transform:rotate(14deg);bottom:-70px"><img src="posters/hd/lucylost.jpg"></div>
<div class="p" style="left:505px;width:270px;height:405px;bottom:-30px;z-index:2"><img src="posters/hd/wildwood.jpg"></div>
<div id="t1"><span>OCTOBER 2026</span></div>
<div id="t2"><b>17</b> NEW ANIMATED MOVIES</div>
</body>
</html>
