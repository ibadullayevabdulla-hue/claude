<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Motion</title>
<style>
@font-face{font-family:"Inter";src:url("fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JB Mono";src:url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");font-weight:100 800;font-display:block}
:root{
  --ink:#141413;--ink-2:#1b1a18;--ink-3:#24231f;
  --cream:#faf9f5;--cream-2:#f0eee6;
  --orange:#d97757;--orange-2:#ec9f7f;
  --muted:#8f8c84;--dim:#5f5d57;
  --green:#86b86b;--red:#e2725f;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JB Mono",ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0}
.ghost{color:transparent}

/* background */
.glow{position:absolute;left:0;top:0;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;background:radial-gradient(closest-side,rgba(217,119,87,.26),rgba(217,119,87,.09) 45%,rgba(217,119,87,0))}
#grid{background-image:radial-gradient(rgba(250,249,245,.10) 1.4px,transparent 1.9px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 15%,transparent 78%)}
.vignette{background:radial-gradient(ellipse 85% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}

/* spark */
.spark{position:absolute;left:0;top:0;width:200px;height:200px;overflow:visible;transform-origin:50% 50%}
.spark line{stroke:var(--orange);stroke-linecap:round}

/* scene 1 */
.title{position:absolute;left:0;top:0;font-size:150px;font-weight:700;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.title .ch{display:inline-block;will-change:transform}
#tag1{position:absolute;left:0;right:0;top:612px;text-align:center;font-size:42px;font-weight:400;color:#cfccc2;letter-spacing:-.01em}
#tag1 b{color:var(--orange);font-weight:600}

/* scene 2 */
#s2{perspective:2200px}
#s2in{position:absolute;inset:0;transform-origin:62% 50%}
#steps{position:absolute;left:112px;top:196px;width:500px}
.kicker{font-family:var(--mono);font-size:19px;letter-spacing:.22em;color:var(--orange);font-weight:600}
.howTitle{font-size:60px;line-height:1.06;font-weight:700;letter-spacing:-.035em;margin-top:22px}
.stepList{position:relative;margin-top:70px}
.step{position:relative;height:100px;display:flex;align-items:flex-start;gap:26px}
.num{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:2px solid #3b3a36;background:var(--ink);font-family:var(--mono);font-size:20px;font-weight:700;color:var(--muted);z-index:1}
.num>*{position:absolute;inset:-2px;border-radius:50%;display:grid;place-items:center}
.num .fill{background:var(--orange)}
.num .ring{border:2px solid var(--orange)}
.num .ck svg{width:24px;height:24px}
.lbl{font-size:31px;font-weight:600;line-height:50px;letter-spacing:-.015em}
.sub{font-family:var(--mono);font-size:17px;color:var(--muted);margin-top:-2px}
.rail{position:absolute;left:24px;top:25px;width:2px;height:300px;background:#33322f}
.rail i{display:block;width:100%;height:0;background:var(--orange)}

#term{position:absolute;left:668px;top:118px;width:1146px;height:844px;border-radius:20px;background:#1a1917;border:1px solid rgba(250,249,245,.09);box-shadow:0 60px 140px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden;transform-origin:50% 60%;display:flex;flex-direction:column}
.tbar{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 22px;border-bottom:1px solid rgba(250,249,245,.06);background:#201f1c}
.tbar i{width:13px;height:13px;border-radius:50%;background:#3a3935}
.tbar i:nth-child(1){background:#ec6a5e}.tbar i:nth-child(2){background:#f4bf4f}.tbar i:nth-child(3){background:#61c554}
.tbar .ttl{flex:1;text-align:center;font-family:var(--mono);font-size:16px;color:var(--muted);margin-right:62px}
.tbody{flex:1;display:flex;flex-direction:column;padding:24px 34px 18px;font-family:var(--mono);font-size:20px;line-height:32px;color:#e9e7df;min-height:0}
.tview{flex:1;position:relative;overflow:hidden;min-height:0}
.tscroll{position:absolute;left:0;right:0;top:0}
.it{overflow:hidden}
.it>div{white-space:pre}
.pfx{color:#7aa2c8}.sh{color:var(--muted)}
.cur{display:inline-block;width:11px;height:24px;background:var(--cream);vertical-align:-5px;margin-left:1px}
.welcome{border:1.5px solid var(--orange);border-radius:12px;padding:12px 22px;margin:16px 0 20px;width:720px}
.welcome .star{color:var(--orange)}
.welcome b{font-weight:700}
.m{color:var(--muted)}
.user{color:#bdbab1;background:rgba(250,249,245,.055);border-radius:8px;padding:6px 14px;margin:0 0 18px -14px;display:inline-block}
.it .user{display:block;width:max-content}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--green);margin:0 14px 0 3px;vertical-align:1px}
.tool b{font-weight:700;color:var(--cream)}
.tool .arg{color:#cfccc3}
.out{color:var(--muted);padding-bottom:12px}
.out b{color:#cfccc3;font-weight:600}
.elbow{display:inline-block;width:14px;height:14px;border-left:2px solid #5d5b55;border-bottom:2px solid #5d5b55;margin:0 14px 0 8px;vertical-align:5px}
.diffbox{padding:0 0 16px 36px}
.diff{border-radius:8px;overflow:hidden;font-size:18px;line-height:29px;width:780px;border:1px solid rgba(250,249,245,.06)}
.dl{display:flex;white-space:pre}
.dl .ln{width:54px;text-align:right;padding-right:14px;color:var(--dim)}
.dl .sg{width:24px}
.dl.add{background:rgba(134,184,107,.15);color:#c6e0b6}.dl.add .sg{color:var(--green)}
.dl.del{background:rgba(226,114,95,.15);color:#f1b0a4}.dl.del .sg{color:var(--red)}
.dl.ctx{color:#a9a69d}
.pbar{display:inline-block;width:300px;height:12px;border-radius:6px;background:#33322e;vertical-align:1px;overflow:hidden;margin-right:16px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange-2))}
.pass{color:var(--green)}
.asst .dot{background:var(--cream)}
.asst{padding-top:4px;color:var(--cream)}
.spin{height:44px;flex:none;display:flex;align-items:center;gap:12px;color:var(--orange);white-space:pre}
.spin .sg{width:22px;text-align:center}
.spin .sv{background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 38%,#ffd9c8 50%,var(--orange) 62%,var(--orange) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.spin .st{color:var(--dim)}
.inbox{height:60px;flex:none;border:1.5px solid #4a4843;border-radius:12px;display:flex;align-items:center;padding:0 18px;gap:14px;color:var(--cream);white-space:pre}
.inbox .pr{color:var(--muted)}
.hint{height:30px;flex:none;font-size:16px;color:var(--dim);padding:8px 20px 0}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;padding:15px 26px 15px 18px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:650;font-size:25px;letter-spacing:-.01em;box-shadow:0 24px 60px rgba(0,0,0,.5);white-space:nowrap}
.chip svg{width:32px;height:32px;flex:none}
.chip .rg{position:absolute;inset:0;border-radius:999px;border:3px solid var(--cream)}

/* scene 3 */
.wl{position:absolute;inset:0;overflow:hidden}
.wbg{position:absolute;top:50%;left:0;margin-top:-290px;font-size:560px;font-weight:800;letter-spacing:-.05em;line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px var(--sc);opacity:.16}
.wword{position:absolute;left:0;right:0;top:50%;margin-top:-140px;text-align:center;font-size:250px;font-weight:800;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.wsub{position:absolute;left:0;right:0;top:50%;margin-top:150px;text-align:center;font-family:var(--mono);font-size:32px;font-weight:500;opacity:.75}
.wnum{position:absolute;left:96px;top:78px;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.12em}
.wkick{position:absolute;right:96px;top:78px;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.12em}
.wbar{position:absolute;left:96px;right:96px;bottom:84px;display:flex;gap:14px}
.wbar span{flex:1;height:5px;border-radius:3px;background:var(--sc);opacity:.25;overflow:hidden;position:relative}
.wbar span i{position:absolute;inset:0;background:var(--sc);transform-origin:0 50%;transform:scaleX(0)}
.wbar span.full{opacity:1}

/* scene 4 */
#s4{background:var(--ink)}
#whead{position:absolute;left:0;right:0;top:170px;text-align:center}
#whead .kicker{display:block}
#whead h2{font-size:84px;font-weight:700;letter-spacing:-.04em;margin-top:18px}
#cards{position:absolute;inset:0;perspective:1500px}
.card{position:absolute;width:380px;height:212px;border-radius:26px;background:linear-gradient(160deg,#22211e,#1a1917);border:1.5px solid rgba(250,249,245,.09);padding:30px 32px;box-shadow:0 30px 70px rgba(0,0,0,.45);transform-origin:50% 100%}
.card .ic{width:66px;height:66px;border-radius:18px;background:rgba(217,119,87,.14);color:var(--orange);display:grid;place-items:center}
.card .ic svg{width:34px;height:34px}
.card .nm{font-size:36px;font-weight:650;letter-spacing:-.02em;margin-top:22px;line-height:1}
.card .sb{font-family:var(--mono);font-size:19px;color:var(--muted);margin-top:12px}
.card .hl{position:absolute;inset:-1.5px;border-radius:26px;border:2px solid var(--orange);box-shadow:0 0 60px rgba(217,119,87,.35),inset 0 0 40px rgba(217,119,87,.12);opacity:0}

/* scene 5 */
#title2{font-size:150px}
#tag2{position:absolute;left:0;right:0;top:612px;text-align:center;font-size:44px;font-weight:500;letter-spacing:-.02em;color:#e4e1d8}
#pill{position:absolute;left:50%;top:712px;height:78px;border-radius:999px;background:#211f1c;border:1.5px solid rgba(217,119,87,.55);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 50px rgba(217,119,87,.12)}
#pill .in{position:absolute;left:36px;top:0;height:100%;display:flex;align-items:center;font-family:var(--mono);font-size:27px;white-space:pre;color:var(--cream)}
#pill .dl2{color:var(--orange)}
#url{position:absolute;left:0;right:0;top:836px;text-align:center;font-size:32px;color:#cfccc2;display:flex;justify-content:center;align-items:center;gap:14px}
#url svg{width:30px;height:30px}
#url b{color:var(--orange);font-weight:600}

#flash{background:var(--orange)}
#fade{background:#000}

/* live-playback controls (hidden while rendering) */
#bar{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);cursor:pointer}
#bar i{display:block;height:100%;width:0;background:#d97757}
#hint{position:fixed;right:14px;bottom:12px;font:12px/1 ui-monospace,Menlo,monospace;color:rgba(255,255,255,.35)}
.render #bar,.render #hint{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer">
    <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div>
    <div id="grid" class="layer"></div>
    <canvas id="dust" class="layer" width="1920" height="1080"></canvas>
    <div class="layer vignette"></div>
  </div>

  <section id="s1" class="layer">
    <svg id="spark1" class="spark" viewBox="-100 -100 200 200"></svg>
    <div id="title1" class="title"></div>
    <div id="tag1"></div>
  </section>

  <section id="s2" class="layer">
    <div id="s2in">
      <div id="steps">
        <div class="kicker" id="howHead"></div>
        <div class="howTitle" id="howTitle"></div>
        <div class="stepList" id="stepList"><div class="rail"><i id="railFill"></i></div></div>
      </div>
      <div id="term">
        <div class="tbar"><i></i><i></i><i></i><span class="ttl">~/my-app — claude</span></div>
        <div class="tbody">
          <div class="tview" id="tview"><div class="tscroll" id="tscroll"></div></div>
          <div class="spin" id="spin"><span class="sg"></span><span class="sv"></span><span class="st"></span></div>
          <div class="inbox" id="inbox"><span class="pr">&gt;</span><span id="intext"><span></span><span class="ghost"></span></span></div>
          <div class="hint" id="thint">? for shortcuts</div>
        </div>
      </div>
      <div class="chip" id="chip1"><span class="rg"></span><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#5f9e47"/><path d="M9.5 16.5l4.2 4.2 8.8-9.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="chip1t"></span></div>
      <div class="chip" id="chip2"><span class="rg"></span><svg viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2v.8a4 4 0 0 1-4 4h-4a4 4 0 0 0-4 4"/></svg><span>feat/dark-mode</span></div>
    </div>
  </section>

  <section id="s3" class="layer"></section>

  <section id="s4" class="layer">
    <div class="glow" id="g4"></div>
    <div id="whead"><span class="kicker" id="wkick"></span><h2 id="wtitle"></h2></div>
    <div id="cards"></div>
  </section>

  <section id="s5" class="layer">
    <svg id="spark2" class="spark" viewBox="-100 -100 200 200"></svg>
    <div id="title2" class="title"></div>
    <div id="tag2"></div>
    <div id="pill"><div class="in"><span class="dl2">$ </span><span id="cmd"><span></span><span class="ghost"></span></span></div></div>
    <div id="url"></div>
  </section>

  <div id="flash" class="layer"></div>
  <div id="fade" class="layer"></div>
</div>
<div id="bar"><i></i></div>
<div id="hint">space · ← → · click</div>

<script>
"use strict";
/* ───────────── copy ───────────── */
const COPY = {
  uz: {
    tagline: "Terminalingizdagi <b>AI dasturchi</b>",
    prompt: "Login sahifasiga dark mode qoʻsh va testlarni ishga tushir",
    verbs: ["Oʻylanmoqda", "Tahrirlanmoqda", "Testlanmoqda", "Commit qilinmoqda"],
    tokens: "token", esc: "esc — toʻxtatish",
    final: "Tayyor! Dark mode qoʻshildi, barcha 24 ta test muvaffaqiyatli oʻtdi.",
    howHead: "QANDAY ISHLAYDI",
    howTitle: "Siz aytasiz —<br>Claude bajaradi.",
    steps: [["Kodni oʻrganadi", "Read · Search"], ["Oʻzgartiradi", "Update"], ["Testlaydi", "Bash · npm test"], ["Commit qiladi", "Bash · git"]],
    chipTests: "24/24 test oʻtdi",
    words: ["Oʻqiydi.", "Yozadi.", "Tuzatadi.", "Sinaydi.", "Yetkazadi."],
    wordSubs: ["Read · Grep · Glob", "Write · Edit", "bug → fix", "npm test ✓", "git push → PR #128"],
    wordKick: "CLAUDE CODE",
    whereKick: "HAMMA JOYDA",
    where: "Siz ishlaydigan joyda",
    cards: ["claude", "Kengaytma", "Plagin", "Ilova", "claude.ai/code", "@claude"],
    outro: "Gʻoyadan pull requestgacha.",
    cta: "Bugunoq sinab koʻring"
  },
  en: {
    tagline: "Your <b>AI coding partner</b>, right in the terminal",
    prompt: "Add dark mode to the login page and run the tests",
    verbs: ["Thinking", "Editing", "Testing", "Committing"],
    tokens: "tokens", esc: "esc to interrupt",
    final: "Done! Dark mode is live on the login page and all 24 tests pass.",
    howHead: "HOW IT WORKS",
    howTitle: "You ask.<br>Claude ships.",
    steps: [["Explores the code", "Read · Search"], ["Makes the edits", "Update"], ["Runs the tests", "Bash · npm test"], ["Commits the work", "Bash · git"]],
    chipTests: "24/24 tests passed",
    words: ["Reads.", "Writes.", "Fixes.", "Tests.", "Ships."],
    wordSubs: ["Read · Grep · Glob", "Write · Edit", "bug → fix", "npm test ✓", "git push → PR #128"],
    wordKick: "CLAUDE CODE",
    whereKick: "EVERYWHERE",
    where: "Works where you work",
    cards: ["claude", "Extension", "Plugin", "App", "claude.ai/code", "@claude"],
    outro: "From idea to pull request.",
    cta: "Try it today"
  }
};
const Q = new URLSearchParams(location.search);
const LANG = COPY[Q.get("lang")] ? Q.get("lang") : "uz";
const S = COPY[LANG];
const RENDER = Q.has("render");
const DUR = 30;
document.documentElement.lang = LANG;
if (RENDER) document.documentElement.classList.add("render");

/* ───────────── math ───────────── */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  outCubic: x => 1 - (1 - x) ** 3,
  inCubic: x => x ** 3,
  inOutCubic: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  outExpo: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  inExpo: x => x <= 0 ? 0 : 2 ** (10 * x - 10),
  outBack: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; }
};
/** eased progress of a tween that starts at `a` and lasts `d` seconds */
const P = (t, a, d, e = E.outCubic) => e(clamp((t - a) / d));
/** 0 → 1 → 0 bump centred on `c` with half-width `w` */
const bump = (t, c, w) => clamp(1 - Math.abs(t - c) / w);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const show = (el, on) => { const d = on ? "" : "none"; if (el.style.display !== d) el.style.display = d; return on; };
const tf = (el, v) => { el.style.transform = v; };

/* typed text: a visible span followed by a transparent remainder, so layout never jumps */
function typed(el, text, n) {
  n = clamp(n, 0, text.length) | 0;
  if (el._n === n && el._s === text) return n;
  el._n = n; el._s = text;
  el.firstChild.textContent = text.slice(0, n);
  el.lastChild.textContent = text.slice(n);
  return n;
}
const typeSpan = (cur = false) => `<span class="ty"><span></span>${cur ? '<span class="cur"></span>' : ''}<span class="ghost"></span></span>`;

/* ───────────── spark ───────────── */
function makeSpark(svg, seed) {
  const r = rng(seed), rays = [], n = 12;
  for (let i = 0; i < n; i++) {
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("stroke-width", 15);
    svg.appendChild(ln);
    rays.push({ ln, ang: (i / n) * Math.PI * 2 - Math.PI / 2 + (r() - .5) * .14, len: 58 + r() * 32 });
  }
  return rays;
}
function drawSpark(rays, p, t) {
  rays.forEach((r, i) => {
    const k = E.outBack(clamp((p - i * .035) / .55));
    const L = Math.max(0, r.len * k * (1 + .045 * Math.sin(t * 3.2 + i * 1.7)));
    r.ln.setAttribute("x2", (Math.cos(r.ang) * L).toFixed(2));
    r.ln.setAttribute("y2", (Math.sin(r.ang) * L).toFixed(2));
  });
}
const rays1 = makeSpark($("spark1"), 7);
const rays2 = makeSpark($("spark2"), 7);

function letters(el, text) {
  el.innerHTML = [...text].map(c => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
  return [...el.children];
}
const chars1 = letters($("title1"), "Claude Code");
const chars2 = letters($("title2"), "Claude Code");
$("tag1").innerHTML = S.tagline;
$("tag2").textContent = S.outro;
$("url").innerHTML = `${S.cta}<svg viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b>claude.ai/code</b>`;
const INSTALL = "curl -fsSL https://claude.ai/install.sh | bash";

/* ───────────── background dust ───────────── */
const dctx = $("dust").getContext("2d");
const dust = (() => { const r = rng(42); return Array.from({ length: 120 }, () => ({ x: r() * 1920, y: r() * 1180, s: .7 + r() * 2.3, v: 6 + r() * 26, ph: r() * 6.283, a: .1 + r() * .42, o: r() < .32 })); })();
function drawDust(t) {
  dctx.clearRect(0, 0, 1920, 1080);
  for (const d of dust) {
    const y = ((d.y - d.v * t) % 1180 + 1180) % 1180 - 50;
    const x = d.x + Math.sin(t * .7 + d.ph) * 18;
    dctx.globalAlpha = d.a * (.6 + .4 * Math.sin(t * 2.3 + d.ph * 3));
    dctx.fillStyle = d.o ? "#d97757" : "#faf9f5";
    dctx.beginPath(); dctx.arc(x, y, d.s, 0, 6.283); dctx.fill();
  }
}

  sp.style.opacity = P(t, .15, .3);

    const k = P(t, 1.62 + i * .045, .8, E.outExpo), o = P(t, 3.2 + i * .015, .3, E.inCubic);
    c.style.opacity = k * (1 - o);
    tf(c, `translate(${(1 - k) * 50}px,${(1 - k) * 46 - o * 40}px)`);

    c.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : "none";
  });
  const tg = P(t, 27.35, .8, E.outExpo);
  $("tag2").style.opacity = tg; tf($("tag2"), `translateY(${(1 - tg) * 28}px)`);
  const pk = P(t, 27.75, .7, E.outExpo);
  const pill = $("pill");
  pill.style.opacity = clamp(pk * 2);
  pill.style.width = lerp(80, M.pillW, pk).toFixed(1) + "px";
  tf(pill, `translateX(-50%) translateY(${(1 - pk) * 24}px)`);
  typed($("cmd"), INSTALL, (t - 27.95) * 58);
  const uk = P(t, 28.65, .7, E.outExpo);
  $("url").style.opacity = uk; tf($("url"), `translateY(${(1 - uk) * 20}px)`);
}

/* ───────────── boot ───────────── */
let ready;
window.__ready = new Promise(r => { ready = r; });
window.__seek = t => render(t);
window.__duration = DUR;

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = `scale(${s})`;
}
addEventListener("resize", fit);
fit();

document.fonts.ready.then(() => Promise.all([document.fonts.load('700 20px "Inter"'), document.fonts.load('400 20px "JB Mono"')])).then(() => {
  measure();
  render(0);
  ready();
  if (RENDER) return;
  if (Q.has("t")) { render(+Q.get("t")); return; }
  let start = performance.now(), paused = false, pt = 0;
  const now = () => paused ? pt : ((performance.now() - start) / 1000) % DUR;
  const seek = t => { start = performance.now() - t * 1000; pt = t; };
  addEventListener("keydown", e => {
    if (e.code === "Space") { if (paused) seek(pt); else pt = now(); paused = !paused; e.preventDefault(); }
    if (e.code === "ArrowRight") seek(Math.min(DUR - .01, now() + 2));
    if (e.code === "ArrowLeft") seek(Math.max(0, now() - 2));
  });
  $("bar").addEventListener("click", e => { e.stopPropagation(); seek(e.clientX / innerWidth * DUR); });
  $("stage").addEventListener("click", () => seek(0));
  (function loop() {
    const t = now();
    render(t);
    $("bar").firstChild.style.width = (t / DUR * 100) + "%";
    requestAnimationFrame(loop);
  })();
});
</script>
